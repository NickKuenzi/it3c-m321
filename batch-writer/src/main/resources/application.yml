spring:
  application:
    name: batch-writer

  rabbitmq:
    # Im Docker-Netz heisst der Broker "rabbitmq". Beim Start ausserhalb
    # von Docker greift der Vorgabewert "localhost".
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  datasource:
    # Im Docker-Netz heisst die Datenbank "postgres". Zugangsdaten kommen
    # aus .env, im Repository stehen nur Beispielwerte.
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:chat}
    username: ${POSTGRES_USER:chat}
    password: ${POSTGRES_PASSWORD:chat}

  sql:
    init:
      # schema.sql bei jedem Start ausführen. Ohne diese Zeile tut Spring Boot
      # das nur bei eingebetteten Datenbanken, nicht bei PostgreSQL.
      mode: always

batch-writer:
  # Ein Stapel ist bei 500 Nachrichten voll. Kommt 200 ms lang keine neue,
  # geht er auch unvollständig los (Spezifikation 3.1, 4.4).
  batch-size: 500
  batch-timeout-ms: 200
  # So viele Nachrichten darf der Verbraucher unbestätigt halten.
  # Mindestens so gross wie der Stapel, sonst wird nie ein Stapel voll.
  prefetch: 500

logging:
  level:
    # Im Unterricht wollen wir jeden Schritt sehen.
    ch.benedict.m321: DEBUG
